name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ActionsBar.app
          path: build/ActionsBar.app
